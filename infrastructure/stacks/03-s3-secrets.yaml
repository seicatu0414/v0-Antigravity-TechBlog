AWSTemplateFormatVersion: '2010-09-09'
Description: 'TechBlog - Storage (S3) and Secrets Manager'

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev
  
  ProjectName:
    Type: String
    Default: techblog
  
  AppRunnerRoleArn:
    Type: String
    Description: App Runner Instance Role ARN to grant S3 access

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  # --- S3 Bucket for App Assets/Images ---
  AssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Append a random string via account id to ensure global uniqueness
      BucketName: !Sub '${ProjectName}-${Environment}-assets-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration:
        Status: !If [IsProd, Enabled, Suspended]
      # Restrict origins in production (using a parameter or default condition)
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: 
              - !If [IsProd, 'https://techblog.example.com', '*'] # Replace with actual domain in prod
            MaxAge: 3600

  # --- S3 Bucket Policy (Restricting access to App Runner) ---
  AssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref AppRunnerRoleArn
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
            Resource: !Sub '${AssetsBucket.Arn}/*'

  # --- Secrets Manager ---
  
  # 1. Database Connection Secret
  # The RDS stack will update this secret, but we initialize it with a generated password
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/database/url'
      Description: !Sub 'PostgreSQL connection URL for ${Environment}'
      GenerateSecretString:
        SecretStringTemplate: '{"username": "postgres", "engine": "postgres", "port": 5432}'
        GenerateStringKey: 'password'
        PasswordLength: 32
        ExcludeCharacters: '"@/\'

  # 2. JWT / NextAuth Secret
  AppSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/app/secrets'
      Description: 'Application secrets like JWT and Auth salts'
      GenerateSecretString:
        # We auto-generate a secure random 64-char string for JWT_SECRET
        SecretStringTemplate: '{}'
        GenerateStringKey: 'JWT_SECRET'
        PasswordLength: 64
        ExcludeCharacters: '"@/\'

Outputs:
  AssetsBucketName:
    Value: !Ref AssetsBucket
  AssetsBucketArn:
    Value: !GetAtt AssetsBucket.Arn
  DatabaseSecretArn:
    Value: !Ref DatabaseSecret
  DatabaseSecretName:
    Value: !Sub '${ProjectName}/${Environment}/database/url'
  AppSecretsArn:
    Value: !Ref AppSecrets
  AppSecretsName:
    Value: !Sub '${ProjectName}/${Environment}/app/secrets'
