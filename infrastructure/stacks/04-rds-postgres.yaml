AWSTemplateFormatVersion: '2010-09-09'
Description: 'TechBlog - RDS PostgreSQL Database'

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev
  
  ProjectName:
    Type: String
    Default: techblog
  
  # --- Network Configuration ---
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id
  RDSSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  
  # --- Database Configuration ---
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: Use ARM-based t4g instances for cost efficiency
    AllowedValues:
      - db.t4g.micro
      - db.t4g.small
      - db.t4g.medium
  
  DBAllocatedStorage:
    Type: Number
    Default: 20
  
  DBName:
    Type: String
    Default: techblog
  
  DBUsername:
    Type: String
    Default: postgres
  
  # The unified Secrets Manager secret ARN that stores connection info
  DatabaseSecretArn:
    Type: String

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  # --- DB Subnet Group ---
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub '${ProjectName}-${Environment}-subnet-group'
      DBSubnetGroupDescription: Private subnets for RDS
      SubnetIds:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id

  # --- DB Parameter Group ---
  DBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: PostgreSQL 16 parameters
      Family: postgres16

  # --- Update the Database Secret with RDS details ---
  DatabaseSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DatabaseSecretArn
      TargetId: !Ref DBInstance
      TargetType: AWS::RDS::DBInstance

  # --- RDS Instance ---
  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-${Environment}-db'
      Engine: postgres
      EngineVersion: '16.4'
      DBInstanceClass: !Ref DBInstanceClass
      
      # Storage
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3 # using gp3 which is cheaper and better than gp2
      StorageEncrypted: true
      
      # Network
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref RDSSecurityGroupId]
      PubliclyAccessible: false
      
      # Auth Config
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      # Fetch the auto-generated password from SECRETS MANAGER directly using the exact ARN
      MasterPassword: !Join ['', ['{{resolve:secretsmanager:', !Ref DatabaseSecretArn, ':SecretString:password}}']]
      
      # Optimization settings depending on env
      MultiAZ: !If [IsProd, true, false]
      BackupRetentionPeriod: !If [IsProd, 14, 1]
      DeletionProtection: !If [IsProd, true, false]
      
      DBParameterGroupName: !Ref DBParameterGroup

  # --- Custom Resource to append 'url' key to the database secret ---
  UpdateSecretFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: UpdateSecretAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:UpdateSecret
                Resource: !Ref DatabaseSecretArn
        - PolicyName: CloudWatchLogsScopedAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*:*'

  UpdateSecretFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt UpdateSecretFunctionRole.Arn
      Runtime: python3.9
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse
          from urllib.parse import quote
          
          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return
                  
                  secret_arn = event['ResourceProperties']['SecretArn']
                  db_host = event['ResourceProperties']['DBHost']
                  db_port = event['ResourceProperties']['DBPort']
                  db_name = event['ResourceProperties']['DBName']
                  
                  client = boto3.client('secretsmanager')
                  resp = client.get_secret_value(SecretId=secret_arn)
                  
                  secret_dict = json.loads(resp['SecretString'])
                  
                  password = secret_dict.get('password', '')
                  username = secret_dict.get('username', 'postgres')
                  
                  # URI特殊文字をエスケープしてPrismaが安全にパースできるようにする
                  url = f"postgresql://{quote(username, safe='')}:{quote(password, safe='')}@{db_host}:{db_port}/{db_name}?schema=public"
                  secret_dict['url'] = url
                  
                  client.update_secret(SecretId=secret_arn, SecretString=json.dumps(secret_dict))
                  
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Url': url})
              except Exception as e:
                  print(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {})

  UpdateSecretCustomResource:
    Type: Custom::SecretUrlUpdater
    DependsOn: DatabaseSecretAttachment
    Properties:
      ServiceToken: !GetAtt UpdateSecretFunction.Arn
      SecretArn: !Ref DatabaseSecretArn
      DBHost: !GetAtt DBInstance.Endpoint.Address
      DBPort: !GetAtt DBInstance.Endpoint.Port
      DBName: !Ref DBName

Outputs:
  DBInstanceEndpoint:
    Value: !GetAtt DBInstance.Endpoint.Address
  DBInstancePort:
    Value: !GetAtt DBInstance.Endpoint.Port
